name: Share approved weekly instructor packs
on:
  push:
    branches: [main]
    paths:
      - 'curriculum-index.json'
      - '**/lecture-script.md'
      - '**/images/**'
      - '**/data/**'
  workflow_dispatch:
    inputs:
      week_start:
        description: Optional Monday YYYY-MM-DD; defaults to the following week
        type: string
        required: false
      dry_run:
        description: Check pack readiness without publishing
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: weekly-instructor-release
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      WEEK_START: ${{ inputs.week_start || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package a batch only when every scheduled script is ready
        run: |
          args=(weekly)
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ -n "$WEEK_START" ]; then args+=(--week-start "$WEEK_START"); fi
          python3 automation/releases.py "${args[@]}"
